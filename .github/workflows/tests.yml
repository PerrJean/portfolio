# Les tests du site sur GitHub : sur chaque pull request (dont celles de
# Dependabot). La même commande que le hook de pre-commit : `npm run verifier`
# construit le site dans un dossier jetable, lance tous les tests dessus, puis
# le supprime (registre/0107). Un envoi sur `main` ne les lance plus ici :
# `deploy.yml` les joue déjà avant de publier (registre/0119).
name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Chromium pour le test des infobulles dans un navigateur (registre/0097).
      - run: npx playwright install --with-deps chromium
      # Les listes vivent hors du dépôt (CONTRAT) : deux secrets, à déclarer
      # aussi côté Dependabot pour ses pull requests.
      # Écrites après npm ci et Chromium, juste avant verifier : les scripts
      # d'installation des paquets ne les lisent pas. Le build et les tests,
      # eux, chargent du code tiers alors qu'elles sont là : la protection ne
      # couvre que l'installation (registre/0120).
      - name: Listes de confidentialité
        env:
          INTERDITS: ${{ secrets.INTERDITS }}
          EMPLOYEUR: ${{ secrets.EMPLOYEUR }}
        run: |
          mkdir -p ~/.portfolio
          printf '%s\n' "$INTERDITS" > ~/.portfolio/interdits.txt
          printf '%s\n' "$EMPLOYEUR" > ~/.portfolio/employeur.txt
      - run: npm run verifier

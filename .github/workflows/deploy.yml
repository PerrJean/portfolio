# Publication sur GitHub Pages (docs/GUIDE_MISE_EN_LIGNE.md, section 2).
# Un seul build (registre/0119) : `tester` construit le site et le teste par
# `npm run verifier -- --garder .dist-ci` (registre/0107), et c'est ce site
# testé, gardé dans .dist-ci, qui part en ligne. Rien n'est publié si un test
# échoue : le dépôt du site suit les tests dans le même job, et `publier`
# attend `tester`.
# À chaque envoi sur `main`, et à la main depuis l'onglet Actions. Tant que
# `src/i18n/publication.ts` dit `INDEXE = false`, le site est en ligne mais
# caché des moteurs (registre/0035).
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# Le workflow ne peut que lire le dépôt. Les droits de publication ne vont qu'à
# `publier` : `tester` installe et lance des paquets tiers, et le dépôt de
# l'artefact n'en a pas besoin (registre/0120).
permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Chromium pour le test des infobulles dans un navigateur (registre/0097).
      - run: npx playwright install --with-deps chromium
      # Les listes de termes interdits vivent hors du dépôt (CONTRAT) : ici,
      # dans deux secrets. Sans eux, le vérificateur refuse, et rien ne part.
      # Écrites après npm ci et Chromium, juste avant verifier : les scripts
      # d'installation des paquets ne les lisent pas. Le build et les tests,
      # eux, chargent du code tiers alors qu'elles sont là : la protection ne
      # couvre que l'installation (registre/0120).
      - name: Listes de confidentialité
        env:
          INTERDITS: ${{ secrets.INTERDITS }}
          EMPLOYEUR: ${{ secrets.EMPLOYEUR }}
        run: |
          mkdir -p ~/.portfolio
          printf '%s\n' "$INTERDITS" > ~/.portfolio/interdits.txt
          printf '%s\n' "$EMPLOYEUR" > ~/.portfolio/employeur.txt
      # Build dans .dist-ci, puis tous les tests ; --garder laisse le dossier
      # après, pour le dépôt qui suit.
      - run: npm run verifier -- --garder .dist-ci
      # Les tests ne modifient rien dans .dist-ci (mesuré le 2026-11-09,
      # registre/0119) : on dépose le site tel que testé, comme le faisait
      # withastro/action (fichiers cachés compris).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .dist-ci/
          include-hidden-files: true

  publier:
    needs: tester
    runs-on: ubuntu-latest
    # Ce qu'exige actions/deploy-pages, et à ce seul job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v5
